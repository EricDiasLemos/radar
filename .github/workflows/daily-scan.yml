name: Job Radar — Daily Scan

on:
  schedule:
    - cron: '0 11 * * 1-5'  # 08h BRT (UTC-3) seg a sex
  workflow_dispatch:         # trigger manual pelo dashboard ou CLI

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper + auto-apply
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CANDIDATE_EMAIL: ${{ secrets.CANDIDATE_EMAIL }}
          PYTHONPATH: scripts
        run: python scripts/main.py scan
        continue-on-error: false

      - name: Sincronizar data/ para docs/data/ (GitHub Pages)
        run: |
          mkdir -p docs/data
          cp data/jobs.json docs/data/jobs.json
          cp data/sent.json docs/data/sent.json
          [ -f data/blacklist.json ] && cp data/blacklist.json docs/data/blacklist.json || true

      - name: Commit dados atualizados
        run: |
          set -e
          git config user.name  "Job Radar Bot"
          git config user.email "actions@github.com"

          # Adiciona cada arquivo individualmente com log (alguns podem não existir)
          for f in data/jobs.json data/sent.json data/blacklist.json data/archive.json \
                   docs/data/jobs.json docs/data/sent.json docs/data/blacklist.json; do
            if [ -f "$f" ]; then
              git add "$f" && echo "  + $f"
            else
              echo "  - $f (não existe, pulando)"
            fi
          done

          echo ""
          echo "=== git status (staged) ==="
          git status --short --cached

          if git diff --cached --quiet; then
            echo "Nada para commitar — encerrando."
            exit 0
          fi

          MSG="chore: update jobs data $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "$MSG"
          echo "Commit criado: $MSG"

          # Push com retry: pull --rebase antes em caso de conflito com
          # commits paralelos (deletes do dashboard, outro workflow, etc).
          for attempt in 1 2 3; do
            echo ""
            echo "=== Push tentativa $attempt/3 ==="
            if git push origin HEAD; then
              echo "Push OK"
              exit 0
            fi
            echo "Push falhou — fazendo pull --rebase e tentando novamente"
            git pull --rebase --autostash origin main || true
            sleep 2
          done
          echo "ERRO: push falhou após 3 tentativas"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## Job Radar — Resultado do Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python - <<'EOF'
          import json, pathlib
          p = pathlib.Path("data/jobs.json")
          if p.exists():
              d = json.loads(p.read_text())
              s = d.get("stats", {})
              print(f"| Métrica | Valor |")
              print(f"|---------|-------|")
              print(f"| Total de vagas | {s.get('total', 0)} |")
              print(f"| Alto fit 🟢 | {s.get('alto_fit', 0)} |")
              print(f"| Médio fit 🟡 | {s.get('medio_fit', 0)} |")
              print(f"| Enviadas 📤 | {s.get('enviadas', 0)} |")
              print(f"| Última atualização | {d.get('last_updated', 'N/A')} |")
          EOF
          >> $GITHUB_STEP_SUMMARY
